name: My First CI
on:
  push:
    branches:
      -main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Npde
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm Install

      - name: Run application
        run: npm start